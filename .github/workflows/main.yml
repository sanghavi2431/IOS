name: iOS Build

on:
  push:
    branches:
      - test

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Checkout code
      - uses: actions/checkout@v4

      # Install Pods
      - name: Install Pods
        run: pod install

      # Build for simulator (NO SIGNING REQUIRED)
      - name: Build iOS App (Simulator)
        run: |
          xcodebuild -workspace Woloo.xcworkspace \
          -scheme Woloo \
          -configuration Debug \
          -sdk iphonesimulator \
          build

      # Upload build logs (optional but useful)
      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ~/Library/Logs/DiagnosticReports
