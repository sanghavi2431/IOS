name: iOS IPA Build

on:
  push:
    branches:
      - test

jobs:
  build:
    runs-on: macos-26

    steps:
      # Checkout code
      - uses: actions/checkout@v5

      # Select Xcode
      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      # Verify Xcode
      - name: Check Xcode Version
        run: xcodebuild -version

      # Clean old data
      - name: Clean Pods and Derived Data
        run: |
          rm -rf Pods
          rm -rf Podfile.lock
          rm -rf ~/Library/Developer/Xcode/DerivedData

      # Install pods
      - name: Install Pods
        run: pod install --repo-update

      # Create temporary keychain
      - name: Create Keychain
        run: |
          security create-keychain -p temp123 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp123 build.keychain

      # Import .p12 certificate
      - name: Import Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign

      # Install provisioning profile
      - name: Install Provisioning Profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo $MOBILEPROVISION_BASE64 | base64 --decode > \
          ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # Archive app
      - name: Archive App
        run: |
          xcodebuild \
          -workspace Woloo.xcworkspace \
          -scheme Woloo \
          -configuration Release \
          -sdk iphoneos \
          -archivePath build/Woloo.xcarchive \
          archive

      # Export IPA
      - name: Export IPA
        run: |
          xcodebuild \
          -exportArchive \
          -archivePath build/Woloo.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath build/ipa

      # Upload IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: ios-ipa
          path: build/ipa/*.ipa
