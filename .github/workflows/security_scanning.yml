name: iOS Code Review

on:
  push:
    branches: [ test ]

jobs:
  lint:
    name: SwiftLint, SwiftFormat and Security Scan
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint (only errors)
        run: swiftlint --quiet --reporter xcode --strict | tee swiftlint-errors.txt
        continue-on-error: true

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Run SwiftFormat Check
        run: swiftformat . --lint
        continue-on-error: true

      - name: Install Gitleaks
        run: brew install gitleaks

      - name: Run Gitleaks (secrets scan)
        run: gitleaks detect --source . --redact -v --report-path gitleaks-report.json || true
        continue-on-error: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk dependency scan (CocoaPods)
        run: snyk test --file=Podfile.lock --severity-threshold=low | tee snyk-dependency-report.txt
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Run Snyk Code scan (Swift)
        run: snyk code test --severity-threshold=low | tee snyk-code-report.txt
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            swiftlint-errors.txt
            gitleaks-report.json
            snyk-dependency-report.txt
            snyk-code-report.txt
          retention-days: 5
